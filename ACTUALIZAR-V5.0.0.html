<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Actualizar PASIR V5.0.0</title><style>body{font-family:system-ui;background:#081b33;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:650px;background:#fff;color:#10233f;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0005}.ok{color:#087443}button{font-size:18px;padding:12px 18px;border:0;border-radius:12px;background:#1769e0;color:white;font-weight:700}</style></head><body><div class="box"><h1>PASIR V5.0.0</h1><p id="msg">Preparando actualización limpia…</p><button id="go" style="display:none">Abrir PASIR V5.0.0</button></div><script>
(async()=>{const msg=document.getElementById('msg'),go=document.getElementById('go');try{
if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister();}
if('caches'in window){const keys=await caches.keys();for(const k of keys){if((k.startsWith('pasir-gestion-')||k.startsWith('pasir-shell-'))&&!k.startsWith('pasir-durable-'))await caches.delete(k);}}
msg.innerHTML='<b class="ok">Actualización preparada.</b><br>Se retiraron únicamente Service Workers y cachés de archivos de la aplicación. Tus datos locales, cachés durables y configuración de Supabase NO se borraron.';
go.style.display='inline-block';go.onclick=()=>location.replace('./index.html?v=5.0.0&force='+Date.now());
setTimeout(()=>go.click(),1200);
}catch(e){msg.textContent='No se pudo limpiar la caché automáticamente: '+e.message;go.style.display='inline-block';go.onclick=()=>location.replace('./index.html?v=5.0.0&force='+Date.now());}})();
</script></body></html>
